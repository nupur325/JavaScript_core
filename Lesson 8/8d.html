    <body>
        <script>
            function comparePrice(product1,product2){
                if(product1.price< product2.price){
                    return product1
                }
                else{
                    return product2
                }
            }
            const product1={
                name:'basketball',
                price: 2099
            }
            
            const product2={
                name:'basketball',
                price:1095
            }
            console.log(`This is cheaper`)
            console.log(comparePrice(product1,product2))
        </script>
    </body>
