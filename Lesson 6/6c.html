<!DOCTYPE html>
<html>
    <body>
        <script>
            const hour=15
            const name='Nupur'
            if (hour>=6 && hour<=12){
                console.log(`Good Morning ${name};)`)
            }
            else if(hour>=12 && hour<=17){
                console.log(`Good afternoon ${name}`)
            }
            else{
                console.log(`Good night ${name}:o`)
            }
        </script>
    </body>
</html>
